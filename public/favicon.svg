<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C4B7" />
      <stop offset="50%" stop-color="#C27D6B" />
      <stop offset="100%" stop-color="#8E4839" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A7" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="26" fill="#2A1E20"/>
  
  <!-- Stylized Elegant Nail Shape -->
  <path d="M 38 78 C 38 78, 36 42, 38 32 C 40 22, 50 18, 50 18 C 50 18, 60 22, 62 32 C 64 42, 62 78, 62 78 Z" fill="url(#nailGrad)" />
  
  <!-- Nail Shine Highlight -->
  <path d="M 42 34 C 42 27, 48 22, 50 22 C 48 26, 46 36, 45 48 C 44 54, 43 62, 43 62 C 42 55, 42 40, 42 34 Z" fill="#FFFDFB" opacity="0.65" />
  
  <!-- Sparkles -->
  <path d="M 68 24 Q 72 24 72 20 Q 72 24 76 24 Q 72 24 72 28 Q 72 24 68 24 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M 30 52 Q 33 52 33 49 Q 33 52 36 52 Q 33 52 33 55 Q 33 52 30 52 Z" fill="url(#goldGrad)" />
  <circle cx="70" cy="40" r="1.5" fill="#FFE6A7" />
  <circle cx="28" cy="30" r="1.2" fill="#FFE6A7" />
</svg>
